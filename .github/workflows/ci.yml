# CI (M0-08): lint and the test suite on every PR into develop/main and on every push to them.
# Python 3.11 (the floor in pyproject.toml), CPU only. Tests that need the full dataset are marked `data` and skip
# here (no data/ in CI); the tiny fixtures in tests/fixtures/ cover real imagery instead.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                        # a new push to a PR cancels its stale run
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff (the version pinned in requirements.txt)
        # a block scalar, not a plain one: in plain YAML the " #" below would start a comment and cut the command
        run: |
          pip install "$(sed -nE 's/^(ruff[^ #]*).*/\1/p' requirements.txt)"
      - name: ruff
        run: ruff check --output-format=github .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CPU wheels for torch: the default Linux wheel pulls ~2 GB of CUDA libraries a GPU-less runner never uses
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the stack and dronenav
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: pytest
        # the same import path as tools/task.sh test: repo root and src/
        run: PYTHONPATH=src:. pytest -q -ra
