# Tasks labelled `owner-only` (M8-07: clean-up and publishing) are done by the repo owner alone.
# - Someone else assigned to such an issue → they are unassigned, with a comment saying why.
# - A PR for such a task (branch starts with its task ID, or it says "Closes #N") opened by someone else → this check
#   fails, and tools/task.sh finish refuses to merge a PR with a failing check.
name: owner-only

on:
  issues:
    types: [assigned, labeled]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TASK_OWNER: kolyakr
        with:
          script: |
            const { owner, repo } = context.repo;
            const OWNER = process.env.TASK_OWNER;
            const isOwnerOnly = (issue) => issue.labels.some((l) => (l.name || l) === 'owner-only');

            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              if (!isOwnerOnly(issue)) return;
              const others = issue.assignees.map((a) => a.login).filter((l) => l !== OWNER);
              if (!others.length) return;
              await github.rest.issues.removeAssignees({ owner, repo, issue_number: issue.number, assignees: others });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `🔒 This task is **owner-only**: only @${OWNER} works on it. Unassigned ${others.map((l) => '@' + l).join(' ')}.` });
              return;
            }

            // pull_request: find the task(s) this PR belongs to
            const pr = context.payload.pull_request;
            if (pr.user.login === OWNER) return;
            const numbers = new Set([...(pr.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => +m[1]));
            const id = (pr.head.ref.match(/^M\d-\d\d/) || [])[0];
            if (id) {
              const found = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
              for (const i of found) if (!i.pull_request && i.title.startsWith(id + ' ')) numbers.add(i.number);
            }
            for (const n of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              if (isOwnerOnly(issue)) {
                core.setFailed(`#${n} is owner-only: only @${OWNER} may open its PR`);
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                  body: `🔒 #${n} is **owner-only**: only @${OWNER} works on it. Please close this PR.` });
                return;
              }
            }
