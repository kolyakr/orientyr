[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronenav"
dynamic = ["version"]
description = "GNSS-denied drone navigation: localize UAV frames on a satellite map"
readme = "AGENTS.md"
requires-python = ">=3.11"
# The heavy stack (torch, opencv, lightglue) lives in requirements.txt so `pip install -e .`
# stays fast and offline-friendly; install requirements first.
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "dronenav.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]          # experiments/ holds scripts named test_*/stress_test, not tests
markers = ["data: needs the full dataset in data/ (skipped when it is missing)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
